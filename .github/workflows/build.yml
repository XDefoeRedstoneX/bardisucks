name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the app's versionCode is the number of commits
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Test the protocol, the logic and the app's screens
        run: ./gradlew :tuya-lan:test :core:test :cli:build :app:testDebugUnitTest :app:lintDebug

      - name: Build the app
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk bardisucks.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: bardisucks-apk
          path: bardisucks.apk
          if-no-files-found: error

      - name: Upload screenshots of the screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore
